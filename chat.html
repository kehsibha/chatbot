<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- API key screen ---------- */
  #api-key-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    padding: 40px;
    text-align: center;
  }
  #api-key-screen h1 { font-size: 28px; margin-bottom: 8px; }
  #api-key-screen p { color: #6e6e73; margin-bottom: 24px; max-width: 420px; }
  #api-key-input {
    width: 340px;
    padding: 10px 14px;
    border: 1px solid #d2d2d7;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  #api-key-input:focus { border-color: #0071e3; }
  #api-key-submit {
    margin-top: 12px;
    padding: 10px 28px;
    background: #0071e3;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
  }
  #api-key-submit:hover { background: #0077ed; }

  /* ---------- Chat screen ---------- */
  #chat-screen { display: none; flex-direction: column; flex: 1; }

  #chat-header {
    padding: 14px 20px;
    background: #fff;
    border-bottom: 1px solid #e5e5ea;
    font-weight: 600;
    font-size: 16px;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #0071e3;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: #e5e5ea;
    color: #1d1d1f;
    border-bottom-left-radius: 4px;
  }

  #input-bar {
    display: flex;
    gap: 8px;
    padding: 12px 20px;
    background: #fff;
    border-top: 1px solid #e5e5ea;
  }
  #chat-input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #d2d2d7;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  #chat-input:focus { border-color: #0071e3; }
  #send-btn {
    padding: 10px 20px;
    background: #0071e3;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
  }
  #send-btn:hover { background: #0077ed; }
  #send-btn:disabled { background: #a1a1a6; cursor: default; }
</style>
</head>
<body>

<!-- Screen 1: API key entry -->
<div id="api-key-screen">
  <h1>Chatbot</h1>
  <p>Enter your OpenAI API key to start chatting. The key is only stored in memory for this session.</p>
  <input id="api-key-input" type="password" placeholder="sk-..." />
  <button id="api-key-submit">Continue</button>
</div>

<!-- Screen 2: Chat -->
<div id="chat-screen">
  <div id="chat-header">Chatbot</div>
  <div id="messages"></div>
  <div id="input-bar">
    <input id="chat-input" type="text" placeholder="Type a message..." />
    <button id="send-btn">Send</button>
  </div>
</div>

<script>
  const apiKeyScreen  = document.getElementById('api-key-screen');
  const chatScreen    = document.getElementById('chat-screen');
  const apiKeyInput   = document.getElementById('api-key-input');
  const apiKeySubmit  = document.getElementById('api-key-submit');
  const messagesDiv   = document.getElementById('messages');
  const chatInput     = document.getElementById('chat-input');
  const sendBtn       = document.getElementById('send-btn');

  // ---- API key ----
  apiKeySubmit.addEventListener('click', submitApiKey);
  apiKeyInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitApiKey(); });

  function submitApiKey() {
    const key = apiKeyInput.value.trim();
    if (!key) return;
    // Pass the key to the Python backend via pywebview's JS API
    window.pywebview.api.set_api_key(key).then(() => {
      apiKeyScreen.style.display = 'none';
      chatScreen.style.display = 'flex';
      chatInput.focus();
    });
  }

  // ---- Chat ----
  sendBtn.addEventListener('click', sendMessage);
  chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    return div;
  }

  function sendMessage() {
    const text = chatInput.value.trim();
    if (!text) return;

    addMessage('user', text);
    chatInput.value = '';
    sendBtn.disabled = true;

    // Placeholder for the assistant reply
    const replyDiv = addMessage('assistant', '...');

    window.pywebview.api.send_message(text).then(response => {
      replyDiv.textContent = response;
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      sendBtn.disabled = false;
      chatInput.focus();
    }).catch(err => {
      replyDiv.textContent = 'Error: ' + err;
      sendBtn.disabled = false;
    });
  }
</script>
</body>
</html>
